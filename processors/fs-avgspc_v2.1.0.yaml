# https://github.com/baxpr/freesurfer800-iis
# Simply resample freesurfer LGI output (fslgi800_v2) to fsaverage mesh
---
procyamlversion: 3.0.0-dev.0

containers:
  - name: freesurfer
    path: freesurfer800-iis_v2.1.0.sif
    source: docker://baxterprogers/freesurfer800-iis:v2.1.0
requirements:
  walltime: 0-4
  memory: 8G
jobtemplate: job_template_v3.txt

inputs:
  xnat:
    
    filters:
      - type: match
        inputs: scan_t1,fslgi/scan_t1
          
    scans:
      - name: scan_t1
        types: T1*,cs*
        skip_unusable: True
        needs_qc: False

    assessors:
      - name: fslgi
        types: fslgi800_v2
        resources: 
          - {resource: SUBJECT, fdest: freesurfer, ftype: DIR}

outputs:
  - {path: lh.lgi.fsaverage.mgh, type: FILE, resource: LGI_AVG}
  - {path: rh.lgi.fsaverage.mgh, type: FILE, resource: LGI_AVG}


command:
  type: singularity_exec
  container: freesurfer
  opts: >-
    --home $JOBDIR
    --bind $INDIR:/INPUTS
    --bind $OUTDIR:/OUTPUTS
    --bind $JOBDIR:/tmp
  extraopts: >-
    --bind /data/mcr/centos7/FS6/license.txt:/usr/local/freesurfer/8.0.0-1/.license
  args: >-
    bash -c '

    export SUBJECTS_DIR=/INPUTS/freesurfer &&
    export SUBJECT=SUBJECT &&
    ln -s "\$FREESURFER_HOME/subjects/fsaverage" "\$SUBJECTS_DIR/fsaverage"
    &&

    mri_surf2surf 
      --srcsubject \$SUBJECT
      --trgsubject fsaverage
      --hemi lh
      --sval \$SUBJECTS_DIR/\$SUBJECT/surf/lh.pial_lgi
      --tval /OUTPUTS/lh.pial_lgi.fsaverage.mgh
    &&

    mri_surf2surf 
      --srcsubject \$SUBJECT
      --trgsubject fsaverage
      --hemi rh
      --sval \$SUBJECTS_DIR/\$SUBJECT/surf/rh.pial_lgi
      --tval /OUTPUTS/rh.pial_lgi.fsaverage.mgh
    &&
    
    mri_surf2surf
      --srcsubject \$SUBJECT
      --trgsubject fsaverage
      --hemi lh
      --sval \$SUBJECTS_DIR/\$SUBJECT/surf/lh.area
      --tval /OUTPUTS/lh.area.jac.fsaverage.mgh
      --jac
    &&
    
    mri_surf2surf
      --srcsubject \$SUBJECT
      --trgsubject fsaverage
      --hemi rh
      --sval \$SUBJECTS_DIR/\$SUBJECT/surf/rh.area
      --tval /OUTPUTS/rh.area.jac.fsaverage.mgh
      --jac
    &&

    mri_surf2surf
      --srcsubject \$SUBJECT
      --trgsubject fsaverage
      --hemi       lh
      --sval       \$SUBJECTS_DIR/\$SUBJECT/surf/lh.thickness
      --tval       /OUTPUTS/lh.thickness.fsaverage.mgh
    &&

    mri_surf2surf
      --srcsubject \$SUBJECT
      --trgsubject fsaverage
      --hemi       rh
      --sval       \$SUBJECTS_DIR/\$SUBJECT/surf/rh.thickness
      --tval       /OUTPUTS/rh.thickness.fsaverage.mgh

    '
