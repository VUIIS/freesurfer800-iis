# https://github.com/baxpr/freesurfer800-iis
---
procyamlversion: 3.0.0-dev.0

containers:
  - name: freesurfer
    path: freesurfer800-iis_v2.1.0.sif
    source: docker://baxterprogers/freesurfer800-iis:v2.1.0
requirements:
  walltime: 2-0
  memory: 32G
jobtemplate: job_template_v3.txt

inputs:
  xnat:
    
    filters:
      - type: match
        inputs: scan_t1,freesurfer/scan_t1
          
    scans:
      - name: scan_t1
        types: T1*,cs*
        skip_unusable: True
        needs_qc: False

    assessors:
      - name: freesurfer
        types: freesurfer800_v2
        resources: 
          - {resource: SUBJECT, fdest: freesurfer, ftype: DIR}

outputs:
  - {path: SUBJECT, type: DIR, resource: SUBJECT}


command:
  type: singularity_exec
  container: freesurfer
  opts: >-
    --home $JOBDIR
    --bind $INDIR:/INPUTS
    --bind $OUTDIR:/OUTPUTS
    --bind $JOBDIR:/tmp
  extraopts: >-
    --bind /data/mcr/centos7/FS6/license.txt:/usr/local/freesurfer/8.0.0-1/.license
  args: >-
    bash -c '
    cp -R /INPUTS/freesurfer/SUBJECT /OUTPUTS &&
    export SUBJECTS_DIR=/OUTPUTS &&
    recon-all -s SUBJECT -localGI
    '

